name: Auto-Sync Intervals.icu Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Verify sync.py exists
        run: |
          if [ ! -f sync.py ]; then
            echo "ERROR: sync.py not found"
            ls -la
            exit 1
          fi
          echo "sync.py found"

      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.ATHLETE_ID }}" ]; then
            echo "ERROR: ATHLETE_ID secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.INTERVALS_KEY }}" ]; then
            echo "ERROR: INTERVALS_KEY secret not set"
            exit 1
          fi
          echo "All secrets configured"

      - name: Run sync
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          WEEK_START: ${{ secrets.WEEK_START }}
          ZONE_PREFERENCE: ${{ secrets.ZONE_PREFERENCE }}
        run: |
          echo "Python version: $(python --version)"
          echo "Working directory: $(pwd)"

          # 수동 실행 시 평생 기록과 연도별 요약을 다시 생성
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Generating lifetime history and archive files..."

            python sync.py \
              --athlete-id "$ATHLETE_ID" \
              --intervals-key "$INTERVALS_KEY" \
              --generate-history \
              --output history.json || {
                echo "Lifetime history generation failed"
                exit 1
              }
          fi

          # 평상시 최신 7일 데이터 생성
          python sync.py \
            --athlete-id "$ATHLETE_ID" \
            --intervals-key "$INTERVALS_KEY" \
            --days 7 \
            --output latest.json || {
              echo "Normal sync failed"
              exit 1
            }

      - name: Verify latest.json
        run: |
          if [ ! -f latest.json ]; then
            echo "latest.json not found"
            exit 1
          fi

          echo "latest.json exists"
          echo "File size: $(wc -c < latest.json) bytes"

      - name: Archive and commit generated files
        if: success()
        run: |
          YEAR_MONTH=$(date -u +"%Y-%m")
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")

          mkdir -p "archive/${YEAR_MONTH}"
          cp latest.json "archive/${YEAR_MONTH}/${TIMESTAMP}.json"

          echo "Archived latest.json to archive/${YEAR_MONTH}/${TIMESTAMP}.json"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add archive/

          for FILE in \
            latest.json \
            history.json \
            intervals.json \
            routes.json \
            ftp_history.json \
            athlete_archive.json \
            yearly_summary.json \
            personal_bests.json \
            power_curve.json \
            weight_history.json
          do
            if [ -f "$FILE" ]; then
              git add "$FILE"
              echo "Staged $FILE"
            fi
          done

          git pull --rebase --autostash origin main

          if ! git diff --staged --quiet; then
            git commit -m "Update training data and lifetime archive - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
            echo "Generated files committed and pushed"
          else
            echo "No generated changes to commit"
          fi

      - name: Update README with last sync time
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          SYNC_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if [ -f README.md ]; then
            if grep -q "Last successful sync:" README.md; then
              sed -i "s/\*\*Last successful sync:\*\*.*/\*\*Last successful sync:\*\* ${SYNC_TIME}/" README.md
            else
              printf "\n**Last successful sync:** %s\n" "$SYNC_TIME" >> README.md
            fi

            if ! git diff --quiet README.md; then
              git add README.md
              git commit -m "Update last sync timestamp: ${SYNC_TIME}"
              git push
              echo "README timestamp updated"
            fi
          fi

      - name: Upload data files for download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: |
            latest.json
            history.json
            intervals.json
            routes.json
            ftp_history.json
            athlete_archive.json
            yearly_summary.json
            personal_bests.json
            power_curve.json
            weight_history.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Show result
        run: |
          echo "Sync completed successfully"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/latest.json"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Sync failed. Check the logs above."
          echo "Check ATHLETE_ID and INTERVALS_KEY secrets."
